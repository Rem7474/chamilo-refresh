name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à (re)publier, ex. v1.1.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.cjs --tag "${TAG}"
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" dist/*.zip --title "${TAG}" --generate-notes
      - name: Chrome Web Store
        env:
          CWS_EXTENSION_ID: hlenfhclohhglipkoohfohpjaddddndk
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$CWS_SERVICE_ACCOUNT_KEY" ] || [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "Secrets Chrome Web Store absents : étape ignorée."
            exit 0
          fi
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          KEYFILE=$(mktemp)
          trap 'rm -f "$KEYFILE"' EXIT
          echo "$CWS_SERVICE_ACCOUNT_KEY" | jq -r .private_key > "$KEYFILE"
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(echo "$CWS_SERVICE_ACCOUNT_KEY" | jq -c --argjson iat "$NOW" \
            '{iss: .client_email, scope: "https://www.googleapis.com/auth/chromewebstore", aud: "https://oauth2.googleapis.com/token", iat: $iat, exp: ($iat + 3600)}' | b64url)
          SIGNATURE=$(printf '%s.%s' "$HEADER" "$CLAIMS" | openssl dgst -sha256 -sign "$KEYFILE" | b64url)
          TOKEN=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            -d assertion="$HEADER.$CLAIMS.$SIGNATURE" | jq -r .access_token)
          ZIP=$(ls dist/*.zip)
          BASE="https://chromewebstore.googleapis.com"
          ITEM="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          UPLOAD=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -T "$ZIP" "$BASE/upload/v2/$ITEM:upload")
          echo "$UPLOAD"
          if [ "$(echo "$UPLOAD" | jq -r .uploadState)" = "FAILED" ]; then exit 1; fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" "$BASE/v2/$ITEM:publish"
