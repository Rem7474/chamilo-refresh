name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.cjs --tag "${GITHUB_REF_NAME}"
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Chrome Web Store
        env:
          CWS_EXTENSION_ID: hlenfhclohhglipkoohfohpjaddddndk
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "Secrets Chrome Web Store absents : étape ignorée."
            exit 0
          fi
          ZIP=$(ls dist/*.zip)
          TOKEN=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          BASE="https://chromewebstore.googleapis.com"
          ITEM="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          UPLOAD=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -T "$ZIP" "$BASE/upload/v2/$ITEM:upload")
          echo "$UPLOAD"
          if [ "$(echo "$UPLOAD" | jq -r .uploadState)" = "FAILED" ]; then exit 1; fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" "$BASE/v2/$ITEM:publish"
